<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 345" width="1000" height="345" role="img" aria-label="Hybrid detector: long prompts fill the token limit while the request count stays low, and long answers do the opposite; only max(request ratio, token ratio) closes the gate for both">
