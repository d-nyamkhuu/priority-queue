{{- /*
Shared weight cache: one claim mounted by every model-server pod, filled once
by a Job (llm-d's model-cache component, NVIDIA Dynamo's model-download Job).
The Job's name carries the model and revision, so changing either runs a new
download into the same claim; the pods' wait-for-weights init container holds
vLLM until the marker for that model appears.
*/ -}}
{{- if .Values.persistence.enabled }}
{{- $name := include "pd-pool.fullname" . }}
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: {{ $name }}-model-cache
  labels:
    {{- include "pd-pool.labels" . | nindent 4 }}
  annotations:
    # Survives `helm uninstall`, so a reinstall doesn't download again.
    helm.sh/resource-policy: keep
spec:
  accessModes: [{{ .Values.persistence.accessMode }}]
  {{- with .Values.persistence.storageClass }}
  storageClassName: {{ . | quote }}
  {{- end }}
  resources:
    requests:
      storage: {{ .Values.persistence.size }}
---
apiVersion: batch/v1
kind: Job
metadata:
  name: {{ $name }}-download-{{ include "pd-pool.weightsMarker" . | sha256sum | trunc 8 }}
  labels:
    {{- include "pd-pool.labels" . | nindent 4 }}
    app.kubernetes.io/component: download-weights
spec:
  backoffLimit: 6
  template:
    metadata:
      labels:
        {{- include "pd-pool.selectorLabels" . | nindent 8 }}
        app.kubernetes.io/component: download-weights
    spec:
      restartPolicy: Never
      automountServiceAccountToken: false
      # The vLLM image (for its `hf` CLI) on a GPU node, where the model
      # servers need that image anyway.
      {{- with .Values.prefill.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.prefill.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      containers:
        - name: download
          image: {{ include "pd-pool.image" .Values.modelServers.image }}
          imagePullPolicy: {{ .Values.modelServers.image.pullPolicy }}
          command: [sh, -c, {{ include "pd-pool.downloadCommand" . | quote }}]
          env:
            {{- include "pd-pool.hfEnv" . | nindent 12 }}
          resources:
            requests: {cpu: "1", memory: 2Gi}
          volumeMounts:
            - name: hf-cache
              mountPath: /hf-cache
      volumes:
        - name: hf-cache
          persistentVolumeClaim:
            claimName: {{ $name }}-model-cache
{{- end }}
