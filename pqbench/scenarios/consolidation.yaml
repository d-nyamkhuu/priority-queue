# Several tenants consolidated on one pool: does realtime keep its priority?
# Two realtime tenants (A, B) get separate fairness queues in the same band.
# A lower-priority standard tenant C joins and surges. Expected: C's queue
# absorbs the backlog while A and B stay near their baseline p95 TTFT.
name: consolidation
variants: [hybrid]
phases:
  - {name: warmup, duration_s: 30}
  - {name: surge, duration_s: 120}
  - {name: cooldown, duration_s: 60}
measure_phases: [surge]
tenants:
  - {name: realtime-a, objective: realtime, fairness_id: tenant-a, rate: 0.25}
  - {name: realtime-b, objective: realtime, fairness_id: tenant-b, rate: 0.25}
  - {name: standard-c, objective: standard, fairness_id: tenant-c, rate: {warmup: 0.1, surge: 1.3, cooldown: 0.1}}
